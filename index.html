<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Montserrat:wght@200;400&display=swap" rel="stylesheet">

    <style>
  * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
         body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #FFFFFF;
            overflow-x: hidden;
        }
        .main {
              min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 3rem;
            gap: 6rem;
            position: relative;
        }
        .left{
            position: relative;
        }
        .left img {
            width: 450px;
            height: auto;
            /* using w3school cause who remembers ts */
                        filter: drop-shadow(0 30px 80px rgba(255, 255, 255, 0.15));
                                    transition: transform 0.4s ease;


        }
        .right {
            max-width: 550px;
        }
        /* atleast I need to make this look gud */
        .right h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3.5rem, 6vw, 5rem);
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: 8px;
            line-height: 1;
        }
        .right h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.3rem, 2vw, 1.8rem);
            font-weight: 300;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
            opacity: 0.9;
        }
        .right h3 {
            font-size: 0.95rem;
            font-weight: 200;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
            opacity: 0.6;
        }
        .btn button {
             padding: 1.1rem 3rem;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            background-color: #FFFFFF;
            color: #000000;
            border: 1px solid #FFFFFF;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }
        
    </style>
</head>
<body>
    <div>
        <div class="main">
            <div class="left">
                <img src="watch.png" alt="">
            </div>
            <div class="right">
                <h1> TITAN </h1>
                <h2>Timeless Precision</h2>
                <h2>Swiss Craftsmanship</h2>
                <h3>Explore Design, Culture and the Art of Time</h3>
            </div>
            <div class="btn">
                <button>Shop Now</button>
            </div>
        </div>
    </div>
    <script>

    </script>
</body>
</html>
